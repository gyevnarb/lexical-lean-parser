[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lexical-lean-parser"
version = "0.1.0"
description = "Fast, dependency-free lexical parser for Lean 4 declarations and their dependency graph"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bálint Gyevnár" }]
requires-python = ">=3.10"
keywords = ["lean", "lean4", "mathlib", "parser", "dependency-graph", "formal-verification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
graph = ["networkx>=3.0"]
draw = ["networkx>=3.0", "pygraphviz>=1.11"]

[project.scripts]
lean-deps = "lexical_lean_parser.cli:main"

[project.urls]
Homepage = "https://github.com/gyevnarb/lexical-lean-parser"
Repository = "https://github.com/gyevnarb/lexical-lean-parser"
Issues = "https://github.com/gyevnarb/lexical-lean-parser/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "networkx>=3.0"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "validation", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["validation/example/.lake"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "ARG", "BLE", "D"]
ignore = [
    "D105",    # magic methods are self-explanatory
    "D107",
    "PLR0913", # many keyword options are the point of the public API
    "PLR2004",
    "RUF001",  # Lean source is full of Greek letters and other Unicode by design
    "RUF002",
    "RUF003",
    "S105",    # false positive on regex fragments named `_TOKEN`
    "S603",    # subprocess calls run fixed git/lake commands
]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101", "S607", "PLC2701"]
"validation/*" = ["S607", "D103", "D416", "PLR0911", "PLR0912", "PLR0915", "PLR0917"]
